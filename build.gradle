plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// JEI (optional): its API to compile the plugin in net.kasax.raft.compat.jei, the mod itself only in dev runs
	maven {
		url = "https://maven.blamejared.com/"
		content { includeGroup "mezz.jei"; includeGroup "net.mezzdev.config" }
	}
	// Lootr (optional, compile only): Beach Craft's crates and treasure chests become per-player loot when it is installed
	exclusiveContent {
		forRepository { maven { url = "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}

// In-game test harness (src/gametest): a scripted client test driven by client ticks (tools/bctest/README.md), plus
// the NeoForge game tests (net.kasax.raft.gametest.neo). Both only exist in dev runs, never in the release jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

neoForge {
	version = project.neo_version
	validateAccessTransformers = true
	// the resource folders are merged at build time (mergeResources), so the AT is named here
	accessTransformers.from(file('src/main/resources/META-INF/accesstransformer.cfg'))

	mods {
		raft {
			sourceSet sourceSets.main
		}
		raft_gametest {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
			loadedMods = [mods.raft]
		}
		server {
			server()
			loadedMods = [mods.raft]
			gameDirectory = file("build/run/server")
			programArgument "--nogui"
		}
		// NeoForge game tests of src/gametest (namespace raft): sh ./gradlew runGameTestServer
		gameTestServer {
			type = "gameTestServer"
			sourceSet = sourceSets.gametest
			loadedMods = [mods.raft, mods.raft_gametest]
			gameDirectory = file("build/run/gametest")
			systemProperty "neoforge.enabledGameTestNamespaces", "raft_gametest"
			jvmArgument "-Xmx${project.findProperty('xmx') ?: '3G'}"
		}
		// scripted client test (tools/bctest/run.sh)
		bctest {
			client()
			sourceSet = sourceSets.gametest
			loadedMods = [mods.raft, mods.raft_gametest]
			gameDirectory = file("build/run/bctest")
			jvmArgument "-Xmx${project.findProperty('xmx') ?: '3G'}"
			if (project.hasProperty('bcScript')) systemProperty "bc.script", project.property('bcScript').toString()
			if (project.hasProperty('bcOut')) systemProperty "bc.out", project.property('bcOut').toString()
			if (project.hasProperty('bcJfr')) jvmArgument "-XX:StartFlightRecording=filename=${project.property('bcJfr')},settings=profile"
			programArguments.addAll("--username", "BcTester")
		}
	}
}

dependencies {
	// JEI is optional: the plugin (@JeiPlugin) is only loaded when JEI is installed. -Pjei puts JEI into dev runs
	// (tools/bctest/run.sh: BC_JEI=1).
	compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${project.jei_version}"
	if (project.hasProperty('jei')) {
		runtimeOnly "mezz.jei:jei-1.21.1-neoforge:${project.jei_version}"
	}

	// Lootr (optional): compiled against, not bundled; -PwithLootr puts it into the dev runtime (bctest: BC_LOOTR=1)
	compileOnly("maven.modrinth:lootr:${project.lootr_version}") { transitive = false }
	if (project.hasProperty('withLootr')) {
		runtimeOnly("maven.modrinth:lootr:${project.lootr_version}") { transitive = false }
	}
}

// ---------------------------------------------------------------------------------------------------------------
// Beach Craft 3: every content module keeps its assets and data in src/main/modules/<module>/ (same layout as
// src/main/resources). mergeResources combines src/main/resources, src/main/generated (datagen) and all modules
// into build/merged-resources. Files that exist in several places are merged when they are lang files, tags or
// sounds.json; any other duplicate fails the build.
// ---------------------------------------------------------------------------------------------------------------
def resourceRoots = { ->
	def roots = [file('src/main/resources'), file('src/main/generated')]
	def modules = file('src/main/modules')
	if (modules.isDirectory()) {
		modules.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { roots << it }
	}
	roots.findAll { it.isDirectory() }
}
def mergedResources = layout.buildDirectory.dir('merged-resources')

tasks.register('mergeResources') {
	def roots = resourceRoots()
	roots.each { inputs.dir(it) }
	outputs.dir(mergedResources)
	doLast {
		def out = mergedResources.get().asFile
		project.delete(out)
		out.mkdirs()
		def slurper = new groovy.json.JsonSlurper()
		def byPath = new TreeMap<String, List<File>>()
		roots.each { root ->
			root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
				def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
				if (rel.startsWith('.cache/') || rel == '.cache') return
				// NeoForge: the access transformer goes into the jar through processResources (see below), so that
				// ModDevGradle does not read it from this task's output
				if (rel == 'META-INF/accesstransformer.cfg') return
				byPath.computeIfAbsent(rel) { [] } << f
			}
		}
		def writeJson = { File target, Object json ->
			target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
		}
		byPath.each { rel, files ->
			def target = new File(out, rel)
			target.parentFile.mkdirs()
			if (files.size() == 1) {
				java.nio.file.Files.copy(files[0].toPath(), target.toPath())
			} else if (rel ==~ /assets\/[^\/]+\/lang\/[^\/]+\.json/ || rel ==~ /assets\/[^\/]+\/sounds\.json/) {
				def merged = new TreeMap()
				files.each { f ->
					slurper.parse(f, 'UTF-8').each { k, v ->
						if (merged.containsKey(k) && merged[k] != v) {
							throw new GradleException("Key '$k' of $rel is defined differently in $files")
						}
						merged[k] = v
					}
				}
				writeJson(target, merged)
			} else if (rel ==~ /data\/[^\/]+\/tags\/.+\.json/) {
				def values = new LinkedHashSet()
				boolean replace = false
				files.each { f ->
					def j = slurper.parse(f, 'UTF-8')
					if (j.replace) replace = true
					j.values.each { values << it }
				}
				def json = replace ? [replace: true, values: values as List] : [values: values as List]
				writeJson(target, json)
			} else if (files.collect { it.bytes.encodeHex().toString() }.unique().size() == 1) {
				java.nio.file.Files.copy(files[0].toPath(), target.toPath())
			} else {
				throw new GradleException("Resource $rel exists in several places with different content: $files")
			}
		}
	}
}

sourceSets.main.resources.srcDirs = [files(mergedResources) { builtBy 'mergeResources' }]

// the test mod as a jar, to drop next to the release jar into a NeoForge server (registry dump, mixin audit)
tasks.register('gametestJar', Jar) {
	archiveFileName = 'raft_gametest.jar'
	from sourceSets.gametest.output
}

processResources {
	dependsOn 'mergeResources'
	from(file('src/main/resources/META-INF/accesstransformer.cfg')) {
		into 'META-INF'
	}
	inputs.property "version", project.version
	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
