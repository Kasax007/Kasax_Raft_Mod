plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// JEI (optional): its API to compile the plugin in net.kasax.raft.compat.jei, the mod itself only in dev runs
	maven {
		url = "https://maven.blamejared.com/"
		content { includeGroup "mezz.jei" }
	}
	// Lootr (optional, compile only): Beach Craft's crates and treasure chests become per-player loot when it is installed
	exclusiveContent {
		forRepository { maven { url "https://api.modrinth.com/maven" } }
		filter { includeGroup "maven.modrinth" }
	}
}

// In-game test harness (src/gametest): a scripted client test driven by client ticks, see tools/bctest/README.md.
// Fabric's client game test API does not exist for 1.21.1, so the harness runs as an ordinary client mod.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	mods {
		"raft" {
			sourceSet sourceSets.main
		}
		"raft-gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		bctest {
			client()
			name "BcTest"
			source sourceSets.gametest
			runDir "build/run/bctest"
			vmArg "-Xmx${project.findProperty('xmx') ?: '3G'}"
			if (project.hasProperty('bcScript')) vmArg "-Dbc.script=${project.property('bcScript')}"
			if (project.hasProperty('bcOut')) vmArg "-Dbc.out=${project.property('bcOut')}"
			if (project.hasProperty('bcJfr')) vmArg "-XX:StartFlightRecording=filename=${project.property('bcJfr')},settings=profile"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JEI is optional: the plugin (entrypoint jei_mod_plugin) is only loaded when JEI is installed. -Pjei puts JEI
	// into dev runs (tools/bctest/run.sh: BC_JEI=1). JEI for Fabric 1.21.1 is published as a mod jar (remapped here).
	modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
	if (project.hasProperty('jei')) {
		modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") { transitive = false }
		// the JEI jar carries its config library (mezz_config) as a nested jar, which dev runs do not load: unpacked
		def jeiJar = configurations.detachedConfiguration(dependencies.create("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") {
			transitive = false
		}).singleFile
		def nested = layout.buildDirectory.dir('jei-nested').get().asFile
		copy {
			from(zipTree(jeiJar)) { include 'META-INF/jars/*.jar' }
			into nested
			eachFile { it.path = it.name }
			includeEmptyDirs = false
		}
		modLocalRuntime fileTree(nested) { include '*.jar' }
	}

	// Lootr (optional): compiled against, not bundled; -PwithLootr puts it into the dev runtime (bctest: BC_LOOTR=1)
	// together with Cloth Config, which Lootr for 1.21.1 needs
	modCompileOnly("maven.modrinth:lootr:${project.lootr_version}") { transitive = false }
	if (project.hasProperty('withLootr')) {
		modLocalRuntime("maven.modrinth:lootr:${project.lootr_version}") { transitive = false }
		modLocalRuntime("maven.modrinth:cloth-config:${project.cloth_config_version}") { transitive = false }
	}

	// Team Reborn Energy (bundled): cables, batteries and solar panels talk to Tech Reborn machines.
	include modImplementation("teamreborn:energy:${project.energy_version}")
}

// ---------------------------------------------------------------------------------------------------------------
// Beach Craft 3: every content module keeps its assets and data in src/main/modules/<module>/ (same layout as
// src/main/resources). mergeResources combines src/main/resources, src/main/generated (datagen) and all modules
// into build/merged-resources. Files that exist in several places are merged when they are lang files, tags or
// sounds.json; any other duplicate fails the build.
// ---------------------------------------------------------------------------------------------------------------
def resourceRoots = { ->
	def roots = [file('src/main/resources'), file('src/main/generated')]
	def modules = file('src/main/modules')
	if (modules.isDirectory()) {
		modules.listFiles().findAll { it.isDirectory() }.sort { it.name }.each { roots << it }
	}
	roots.findAll { it.isDirectory() }
}
def mergedResources = layout.buildDirectory.dir('merged-resources')

tasks.register('mergeResources') {
	def roots = resourceRoots()
	roots.each { inputs.dir(it) }
	outputs.dir(mergedResources)
	doLast {
		def out = mergedResources.get().asFile
		project.delete(out)
		out.mkdirs()
		def slurper = new groovy.json.JsonSlurper()
		def byPath = new TreeMap<String, List<File>>()
		roots.each { root ->
			root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
				def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
				if (rel.startsWith('.cache/') || rel == '.cache') return
				byPath.computeIfAbsent(rel) { [] } << f
			}
		}
		def writeJson = { File target, Object json ->
			target.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
		}
		byPath.each { rel, files ->
			def target = new File(out, rel)
			target.parentFile.mkdirs()
			if (files.size() == 1) {
				java.nio.file.Files.copy(files[0].toPath(), target.toPath())
			} else if (rel ==~ /assets\/[^\/]+\/lang\/[^\/]+\.json/ || rel ==~ /assets\/[^\/]+\/sounds\.json/) {
				def merged = new TreeMap()
				files.each { f ->
					slurper.parse(f, 'UTF-8').each { k, v ->
						if (merged.containsKey(k) && merged[k] != v) {
							throw new GradleException("Key '$k' of $rel is defined differently in $files")
						}
						merged[k] = v
					}
				}
				writeJson(target, merged)
			} else if (rel ==~ /data\/[^\/]+\/tags\/.+\.json/) {
				def values = new LinkedHashSet()
				boolean replace = false
				files.each { f ->
					def j = slurper.parse(f, 'UTF-8')
					if (j.replace) replace = true
					j.values.each { values << it }
				}
				def json = replace ? [replace: true, values: values as List] : [values: values as List]
				writeJson(target, json)
			} else if (files.collect { it.bytes.encodeHex().toString() }.unique().size() == 1) {
				java.nio.file.Files.copy(files[0].toPath(), target.toPath())
			} else {
				throw new GradleException("Resource $rel exists in several places with different content: $files")
			}
		}
	}
}

sourceSets.main.resources.srcDirs = [files(mergedResources) { builtBy 'mergeResources' }]

processResources {
	dependsOn 'mergeResources'
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
	it.options.compilerArgs += ["-Xmaxerrs", "2000"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
